apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boxoffice-output
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: my-python-pipeline
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: boxoffice-ranking
              image: image-registry.openshift-image-registry.svc:5000/my-namespace/python-pipeline:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "Kaggle.py"]
              args: ["--output", "/output/BoxOfficeCollections_ranked.xlsx"]
              volumeMounts:
                - name: output
                  mountPath: /output
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: boxoffice-output
